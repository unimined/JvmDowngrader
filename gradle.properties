kotlin.code.style=official
org.gradle.jvmargs=-Xmx6G
org.gradle.parallel=true
# Always provision toolchains via foojay; auto-detected system JDKs are
# unverified (CI runner images have shipped corrupt zulu-*-azure installs
# that fail to load classes inside Gradle worker daemons).
org.gradle.java.installations.auto-detect=false

version=3.0.0

mainVersion=8

# because java 7 support is in beta*
testTargetVersion=8

stubFromVersion=7
stubToVersion=27

maven_group=xyz.wagyourtail.jvmdowngrader
archives_base_name=jvmdowngrader
